services:
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
      CADDY_EMAIL: ${CADDY_EMAIL:-ops@example.com}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: Docker stack/backend/Dockerfile
    working_dir: /app/backend
    environment:
      PORT: ${PORT:-8080}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      DATABASE_URL: ${DATABASE_URL:-mariadb://app_user:app_password@mariadb:3306/av_evaluation}
      UPLOADS_DIR: ${UPLOADS_DIR:-/data/uploads}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama.example.internal:11434/api/generate}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:latest}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-medium}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      APP_WORKERS: ${APP_WORKERS:-2}
      APP_THREADS: ${APP_THREADS:-4}
    command:
      - sh
      - /opt/docker-scripts/app-entrypoint.sh
    expose:
      - "8080"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-av_evaluation}
      MARIADB_USER: ${MARIADB_USER:-app_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-app_password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-root-password}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping -h 127.0.0.1 -u${MARIADB_USER:-app_user} -p${MARIADB_PASSWORD:-app_password} --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  mariadb_data:
  uploads_data:
